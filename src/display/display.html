<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Seguidores em Tempo Real</title>
  <link rel="stylesheet" href="display.css">
</head>
<body>
  <main class="stage">

    <header class="brand">
      <span class="brand-dot" id="brand-dot"></span>
      <span class="brand-text">SEGUIDORES&nbsp;&nbsp;EM&nbsp;&nbsp;TEMPO&nbsp;&nbsp;REAL</span>
      <span class="brand-dot" id="brand-dot-2"></span>
    </header>

    <section class="hero">
      <div class="counter" id="counter">0</div>
    </section>

    <div class="delta-row">
      <span class="delta" id="delta">&nbsp;</span>
    </div>

    <section class="grid" id="grid"></section>

    <footer class="bar">
      <div class="bar-cell bar-left">
        <span class="bar-label">STATUS</span>
        <span class="bar-value" id="status-text">iniciando</span>
      </div>
      <div class="bar-cell bar-center">
        <span class="bar-label">ÚLTIMA COLETA</span>
        <span class="bar-value" id="updated-text">—</span>
      </div>
      <div class="bar-cell bar-right">
        <button id="btn-setup">CONFIG</button>
        <button id="btn-exit">SAIR</button>
      </div>
    </footer>

  </main>

  <script src="display.js"></script>
</body>
</html>
